name: Release

# Publica uma versão ao receber uma tag: v1.2.3 é estável, v1.2.3-beta.1 é beta.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    # Com a SignPath, cada versão espera duas aprovações manuais de quem publica.
    timeout-minutes: 180
    env:
      SIGNPATH_ENABLED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Conferir a versão com a tag
        shell: bash
        run: |
          expected="${GITHUB_REF_NAME#v}"
          actual="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$expected" != "$actual" ]; then
            echo "A tag $GITHUB_REF_NAME não bate com a versão $actual em apps/desktop/package.json"
            exit 1
          fi
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:desktop
      - name: Separar os números da versão
        id: version
        shell: bash
        run: |
          full="${GITHUB_REF_NAME#v}"
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "product=${full%%-*}" >> "$GITHUB_OUTPUT"
      # Com o alvo nsis, e não --dir: só assim sai o app-update.yml, sem o qual o programa
      # não consegue verificar atualizações. O instalador deste passo é refeito no seguinte.
      - name: Gerar o programa
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --publish never --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Enviar o programa para assinar
        id: upload-program
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: programa-sem-assinatura
          if-no-files-found: error
          retention-days: 1
          path: release/win-unpacked/XinoIA.exe
      - name: Assinar o programa
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: programa
          github-artifact-id: ${{ steps.upload-program.outputs.artifact-id }}
          parameters: |
            productVersion: "${{ steps.version.outputs.product }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/assinado-programa
      - name: Colocar o programa assinado no lugar
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: cp release/assinado-programa/XinoIA.exe release/win-unpacked/XinoIA.exe
      - name: Gerar instalador e versão portátil
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --publish never --win nsis portable --prepackaged ../../release/win-unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Testar a instalação em uma máquina limpa
        run: npm run test:dist
      # Só depois dos testes: a segunda aprovação vale para um pacote que já passou por eles.
      - name: Enviar os instaladores para assinar
        id: upload-installers
        if: env.SIGNPATH_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: instaladores-sem-assinatura
          if-no-files-found: error
          retention-days: 1
          path: |
            release/XinoIA-Setup-*.exe
            release/XinoIA-Portable-*.exe
      - name: Assinar os instaladores
        if: env.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: instaladores
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          parameters: |
            version: "${{ steps.version.outputs.full }}"
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: release/assinado-instaladores
      - name: Refazer os dados de atualização a partir dos arquivos assinados
        if: env.SIGNPATH_ENABLED == 'true'
        shell: bash
        run: |
          cp release/assinado-instaladores/*.exe release/
          node scripts/refresh-update-info.mjs release
      - name: Conferir a assinatura do Windows
        if: env.SIGNPATH_ENABLED == 'true'
        shell: pwsh
        run: |
          foreach ($file in Get-ChildItem release/win-unpacked/XinoIA.exe, release/XinoIA-Setup-*.exe, release/XinoIA-Portable-*.exe) {
            $signature = Get-AuthenticodeSignature $file.FullName
            if ($signature.Status -ne 'Valid') { throw "$($file.Name): $($signature.Status)" }
            Write-Output "$($file.Name): $($signature.SignerCertificate.Subject)"
          }
      - name: Assinar os pacotes e calcular checksums
        run: node scripts/release-sign.mjs release
        env:
          XINOIA_SIGNING_KEY: ${{ secrets.XINOIA_SIGNING_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: xinoia-windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/XinoIA-Setup-*.exe
            release/XinoIA-Setup-*.exe.blockmap
            release/XinoIA-Setup-*.exe.sig
            release/XinoIA-Portable-*.exe
            release/XinoIA-Portable-*.exe.sig
            release/*.yml
            release/SHA256SUMS.txt
            !release/builder-*.yml

  # Só publica se tudo acima passou. É o único passo com permissão de escrita.
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: xinoia-windows
          path: dist-release
      - name: Montar as notas da versão
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md
        env:
          XINOIA_SIGNED: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist-release/* --title "XinoIA $GITHUB_REF_NAME" --notes-file notes.md --verify-tag $flags
