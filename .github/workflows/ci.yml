name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:web

  # Gera o instalador e o testa em uma máquina limpa a cada mudança na main.
  package:
    if: github.event_name == 'push'
    needs: check
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build:desktop
      # Em dois passos, como na publicação, em que o programa é assinado antes de empacotar.
      # Com o alvo nsis, e não --dir: só assim sai o app-update.yml, sem o qual o programa
      # não consegue verificar atualizações. O instalador deste passo é refeito no seguinte.
      - name: Gerar o programa
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --publish never --win nsis
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Gerar instalador e versão portátil
        working-directory: apps/desktop
        run: npx electron-builder --config electron-builder.yml --publish never --win nsis portable --prepackaged ../../release/win-unpacked
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - run: npm run test:dist
