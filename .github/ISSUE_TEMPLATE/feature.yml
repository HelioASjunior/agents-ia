name: Ideia
description: Sugira uma melhoria
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Qual problema isso resolve
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Como você imagina
    validations:
      required: true
  - type: textarea
    id: others
    attributes:
      label: Alternativas que considerou
